<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#0b0b12;
    color:white;
    height:100vh;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    height:70px;
    display:flex;
    align-items:center;
    padding:0 25px;
    border-bottom:1px solid #252535;
    background:#11111b;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:22px;
    font-weight:bold;
}

.logo-icon{
    width:42px;
    height:42px;
    border-radius:14px;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.status{
    margin-right:auto;
    color:#65f59a;
    font-size:13px;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:35px 20px 120px;
}

.welcome{
    text-align:center;
    margin-top:12vh;
}

.welcome h1{
    font-size:42px;
    margin-bottom:12px;
    background:linear-gradient(90deg,#a78bfa,#60a5fa);
    -webkit-background-clip:text;
    color:transparent;
}

.welcome p{
    color:#aaaabd;
    font-size:17px;
}

.message{
    max-width:750px;
    margin:15px auto;
    padding:15px 18px;
    border-radius:18px;
    line-height:1.7;
}

.user{
    background:#25253a;
}

.ai{
    background:#171722;
    border:1px solid #29293a;
}

.input-area{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    padding:18px;
    background:linear-gradient(transparent,#0b0b12 25%);
}

.input-box{
    max-width:850px;
    margin:auto;
    display:flex;
    gap:10px;
    background:#171722;
    border:1px solid #303044;
    padding:8px;
    border-radius:20px;
}

input{
    flex:1;
    background:transparent;
    border:0;
    outline:0;
    color:white;
    padding:12px;
    font-size:16px;
}

button{
    border:0;
    border-radius:15px;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    color:white;
    padding:0 20px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    opacity:.9;
}

@media(max-width:600px){
    .welcome h1{
        font-size:32px;
    }

    .header{
        padding:0 15px;
    }

    .status{
        display:none;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="logo">
            <div class="logo-icon">✦</div>
            NEXORA AI
        </div>

        <div class="status">● Online</div>
    </header>

    <main class="chat" id="chat">

        <div class="welcome" id="welcome">
            <h1>مرحبًا بك في NEXORA AI</h1>
            <p>مساعدك الذكي الجديد 🚀</p>
        </div>

    </main>

    <div class="input-area">
        <div class="input-box">

            <input
                id="messageInput"
                type="text"
                placeholder="اكتب رسالتك هنا..."
                onkeydown="if(event.key==='Enter') sendMessage()"
            >

            <button onclick="sendMessage()">إرسال</button>

        </div>
    </div>

</div>

<script>

function sendMessage(){

    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");

    const text = input.value.trim();

    if(!text) return;

    if(welcome){
        welcome.remove();
    }

    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = text;

    chat.appendChild(userMessage);

    input.value = "";

    setTimeout(() => {

        const aiMessage = document.createElement("div");
        aiMessage.className = "message ai";

        aiMessage.textContent =
        "أنا NEXORA AI 🤖 حالياً نسخة تجريبية. قريباً هتقدر تسألني وتاخد إجابات حقيقية بالذكاء الاصطناعي.";

        chat.appendChild(aiMessage);

        chat.scrollTop = chat.scrollHeight;

    },700);

    chat.scrollTop = chat.scrollHeight;
}

</script>
<script>
const input = document.querySelector("#messageInput");
const sendBtn = document.querySelector("#sendBtn");
const chat = document.querySelector("#chat");

async function sendMessage() {
  const message = input.value.trim();

  if (!message) return;

  chat.innerHTML += `
    <div class="message user-message">
      ${message}
    </div>
  `;

  input.value = "";

  const loading = document.createElement("div");
  loading.className = "message ai-message";
  loading.textContent = "NEXORA AI بيكتب...";
  chat.appendChild(loading);

  try {
    const response = await fetch("/.netlify/functions/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await response.json();

    loading.textContent = data.reply || data.error || "حصل خطأ.";
  } catch (error) {
    loading.textContent = "مش قادر أتصل بالذكاء الاصطناعي حاليًا.";
  }
}

sendBtn.addEventListener("click", sendMessage);

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    sendMessage();
  }
});
</script>

</body>
</html>
