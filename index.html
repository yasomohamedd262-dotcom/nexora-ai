<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXORA AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080810;
    color: white;
    height: 100vh;
    overflow: hidden;
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* HEADER */

.header {
    height: 72px;
    display: flex;
    align-items: center;
    padding: 0 25px;
    border-bottom: 1px solid #252538;
    background: #10101a;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: bold;
}

.logo-icon {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    box-shadow: 0 0 25px rgba(99, 102, 241, .35);
}

.status {
    margin-right: auto;
    color: #65f59a;
    font-size: 13px;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 30px 20px 130px;
    scroll-behavior: smooth;
}

.welcome {
    text-align: center;
    margin-top: 13vh;
}

.welcome-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.welcome h1 {
    font-size: 42px;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #a78bfa, #60a5fa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.welcome p {
    color: #aaaabd;
    font-size: 17px;
}

/* MESSAGES */

.message {
    max-width: 760px;
    margin: 15px auto;
    padding: 15px 18px;
    border-radius: 18px;
    line-height: 1.7;
    word-wrap: break-word;
}

.user-message {
    background: #25253a;
    border: 1px solid #343450;
}

.ai-message {
    background: #151520;
    border: 1px solid #29293c;
}

/* INPUT */

.input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 18px;
    background: linear-gradient(
        transparent,
        #080810 25%
    );
}

.input-box {
    max-width: 850px;
    margin: auto;
    display: flex;
    gap: 10px;
    background: #151520;
    border: 1px solid #303047;
    padding: 8px;
    border-radius: 20px;
    box-shadow: 0 10px 35px rgba(0,0,0,.35);
}

input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: 0;
    color: white;
    padding: 12px;
    font-size: 16px;
    direction: rtl;
}

input::placeholder {
    color: #77778c;
}

button {
    border: 0;
    border-radius: 15px;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    color: white;
    padding: 0 22px;
    cursor: pointer;
    font-size: 15px;
    transition: .2s;
}

button:hover {
    transform: scale(1.03);
    opacity: .9;
}

/* MOBILE */

@media (max-width: 600px) {

    .header {
        padding: 0 15px;
    }

    .status {
        display: none;
    }

    .welcome {
        margin-top: 10vh;
    }

    .welcome h1 {
        font-size: 31px;
    }

    .welcome p {
        font-size: 15px;
    }

    .message {
        max-width: 95%;
    }

    .input-area {
        padding: 12px;
    }

    button {
        padding: 0 16px;
    }
}
</style>

</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            <div class="logo-icon">
                ✦
            </div>

            NEXORA AI

        </div>

        <div class="status">
            ● Online
        </div>

    </header>


    <!-- CHAT -->

    <main class="chat" id="chat">

        <div class="welcome" id="welcome">

            <div class="welcome-icon">
                🤖
            </div>

            <h1>
                مرحبًا بك في NEXORA AI
            </h1>

            <p>
                مساعدك الذكي الجديد 🚀
            </p>

        </div>

    </main>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-box">

            <input
                id="messageInput"
                type="text"
                placeholder="اكتب رسالتك هنا..."
                autocomplete="off"
            >

            <button id="sendBtn">
                إرسال
            </button>

        </div>

    </div>

</div>


<script>

const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");


function sendMessage() {

    const text = input.value.trim();

    if (!text) {
        return;
    }


    // إزالة شاشة الترحيب

    if (welcome) {
        welcome.remove();
    }


    // رسالة المستخدم

    const userMessage = document.createElement("div");

    userMessage.className = "message user-message";

    userMessage.textContent = text;

    chat.appendChild(userMessage);


    // تنظيف مربع الكتابة

    input.value = "";


    // رسالة مؤقتة

    const loading = document.createElement("div");

    loading.className = "message ai-message";

    loading.textContent = "NEXORA AI بيكتب...";

    chat.appendChild(loading);


    chat.scrollTop = chat.scrollHeight;


    // رد تجريبي

    setTimeout(function() {

        loading.textContent =
        "🤖 أنا NEXORA AI. دي نسخة تجريبية حاليًا، وقريبًا هتقدر تسألني وتحصل على إجابات حقيقية بالذكاء الاصطناعي.";

        chat.scrollTop = chat.scrollHeight;

    }, 900);

}


/* زر الإرسال */

sendBtn.addEventListener("click", sendMessage);


/* زر Enter */

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

    }

});

</script>

</body>

</html>
